  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { font-variant-numeric: tabular-nums; }
  .num { text-align: right; white-space: nowrap; }
  :focus-visible { outline: 3px solid #FF3B1F; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  .ribbon-seg { transition: flex-grow .6s ease; }
  .logo-panel { clip-path: polygon(0 0, 100% 0, calc(100% - 34px) 100%, 0 100%); }
  @media (max-width: 767px) { .logo-panel { clip-path: none; } }
  .ico { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .soft { box-shadow: 0 1px 2px rgba(31,24,48,.04), 0 8px 24px -12px rgba(73,38,127,.18); }
  table.dt { border-collapse: collapse; width: 100%; font-size: .78rem; }
  table.dt th { background: #49267F; color: #fff; font-weight: 600; padding: .45rem .6rem; text-align: left; position: sticky; top: 0; z-index: 1; }
  table.dt td { padding: .4rem .6rem; border-bottom: 1px solid #E3E8EF; vertical-align: top; }
  table.dt tr.tot td { background: #D9E0E8; font-weight: 700; }
  table.dt tbody tr:hover td { background: #F7F4FB; }
  /* tabla compacta: entra completa en pantalla sin desplazamiento horizontal */
  table.dt.compacta { font-size: .68rem; line-height: 1.25; }
  table.dt.compacta th { font-size: .66rem; padding: .35rem .4rem; }
  table.dt.compacta td { padding: .3rem .4rem; }
  table.dt.compacta td span.rounded-full { font-size: .62rem; padding: .05rem .4rem; }
  @media print { .no-print { display: none !important; } body { background: #fff; } }
</style>

        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium">Fecha de corte actual</span>
          <input id="dCur" type="date" class="rounded-md border border-acero px-3 py-2 bg-white">
          <span class="text-xs text-gris">Se propone la fecha del nombre del archivo o la del export.</span>
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium">Fecha de corte anterior</span>
          <input id="dPrev" type="date" class="rounded-md border border-acero px-3 py-2 bg-white" disabled>
          <span class="text-xs text-gris">Se activa al cargar el corte anterior.</span>
        </label>
        <label class="flex flex-col gap-1 text-sm">
          <span class="font-medium">Fecha de línea base</span>
          <input id="dBase" type="date" class="rounded-md border border-acero px-3 py-2 bg-white" disabled>
          <span class="text-xs text-gris">Se activa al cargar la línea base.</span>
        </label>
        <div class="flex flex-wrap gap-2 lg:justify-end">
          <button id="btnRun" class="rounded-md bg-tomate text-white font-semibold px-5 py-2.5 hover:brightness-95 disabled:opacity-40 disabled:cursor-not-allowed" disabled>Generar tablero</button>
        </div>
      </div>
      <div id="msg" role="status" aria-live="polite" class="mt-4 text-sm"></div>
    </div>
  </section>

  <!-- TABLERO -->
  <section id="board" class="hidden mt-6 scroll-mt-4" aria-label="Tablero">
    <!-- lo más importante -->
    <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4" id="heroKpis"></div>
    <!-- distribución por rango (sin PROHIBIDA SU VENTA - ARCSA) -->
    <div class="mt-3 bg-white rounded-2xl border border-acero soft p-4 sm:p-5">
      <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 mb-3"><h2 class="text-base font-bold text-tinta">Productos por revisar según vencimiento</h2><p class="text-xs text-gris" id="ribbonNote"></p></div>
      <div class="flex h-10 w-full overflow-hidden rounded-lg" id="ribbon" role="list" aria-label="Distribución de productos por rango de vencimiento"></div>
      <div class="mt-3 grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-5 gap-x-4 gap-y-3" id="ribbonLegend"></div>
    </div>

    <nav class="no-print mt-6 -mx-4 sm:mx-0 px-4 sm:px-0 overflow-x-auto" aria-label="Secciones">
      <div role="tablist" class="flex gap-1 min-w-max border-b border-acero" id="tabs"></div>
    </nav>

    <div id="panels" class="mt-5"></div>
  </section>
</main>

<script>
(function () {
'use strict';

/* =========================================================
   Configuración y constantes
   ========================================================= */
const CFG = {
  MAX_FILE_MB: 40,
  MAX_ROWS: 150000,
  WINDOW_DAYS: 180,
  IDLE_MIN: 30,
  ARCSA: 'PROHIBIDA SU VENTA - ARCSA',
};
const G = { GES: 'Caducado – gestionado ARCSA', SIN: 'Caducado – sin estado ARCSA', VIG: 'ARCSA con RS vigente', PRO: 'Próximo – seguimiento' };
const R = { CAD: 'CADUCADO', R30: '0–30 días', R60: '31–60 días', R90: '61–90 días', RMAS: '91–180 días' };
const RANGOS = [R.CAD, R.R30, R.R60, R.R90, R.RMAS];
const COLOR = { violeta: '#49267F', violetaClaro: '#8E72B8', tomate: '#FF3B1F', acero: '#D9E0E8', ambar: '#E39B26', gris: '#8C9BB0', tinta: '#1F1830', pizarra: '#3E5A7A' };
const RANGO_COLOR = { [R.CAD]: COLOR.tomate, [R.R30]: COLOR.ambar, [R.R60]: COLOR.violetaClaro, [R.R90]: COLOR.pizarra, [R.RMAS]: COLOR.gris };
const COLS = {
  id: 'ID', ref: 'Referencia interna', nombre: 'Nombre', lab: 'Laboratorio/Nombre', linea: 'Línea de laboratorio/Nombre',
  rs: 'Registro sanitario', fv: 'Fecha vencimiento', estProd: 'Estado de Producto/Estado', qty: 'Cantidad a la mano',
  estRS: 'Estado del registro sanitario', udm: 'UdM de compra/Proporción mayor',
};
const EST_ORD = ['PRODUCTO NUEVO', 'ACTIVO GENERAL', 'DESCONTINUADO', 'LIQUIDACION - FINIQUITO', 'PROHIBIDA SU VENTA - ARCSA', 'BAJA ROTACION', 'ESCASO', 'INACTIVO TEMPORAL'];
const estRank = (e) => { const i = EST_ORD.indexOf(String(e).toUpperCase().trim()); return i < 0 ? 99 : i; };
// ordena pares [estado, n] como la agrupación de Odoo; los estados no listados van al final por cantidad
const estSort = (a, b) => estRank(a[0]) - estRank(b[0]) || b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'es');
const normEst = (s) => { const t = String(s || '').toLowerCase(); if (!t) return ''; if (t.includes('próximo') || t.includes('proximo')) return 'Próximo a caducar'; if (t.includes('caduc') || t.includes('vencid')) return 'Caducado'; if (t.includes('vigente')) return 'Vigente'; return ''; };
// fecha en el nombre del archivo: dd-mm-aaaa, dd_mm_aaaa o aaaa-mm-dd
function fechaNombre(n) {
  let m = /(\d{4})[-_.](\d{2})[-_.](\d{2})/.exec(n), d;
  if (m) d = Date.UTC(+m[1], +m[2] - 1, +m[3]);
  else if ((m = /(\d{2})[-_.](\d{2})[-_.](\d{4})/.exec(n))) d = Date.UTC(+m[3], +m[2] - 1, +m[1]);
  if (d == null || isNaN(d)) return null;
  const y = new Date(d).getUTCFullYear(); return y >= 2020 && y <= 2100 ? d : null;
}
const REQUIRED = ['id', 'ref', 'nombre', 'lab', 'rs', 'fv', 'estProd', 'qty'];
const DAY = 86400000;

/* =========================================================
   Estado (solo en memoria – ISO 27001 A.8.10 / A.8.12)
   ========================================================= */
let S = { cur: null, prev: null, base: null, inter: [], mae: null, maeMap: null, curD: null, prevD: null, baseD: null, interD: [], mov: null, log: [], charts: [], topCharts: [], tab: 'resumen', expFull: {}, expName: {}, alc: 'cad', meta: 20, colaF: '', comp: null, cmp: null, mtz: null };

/* =========================================================
   Utilidades
   ========================================================= */
const $ = (id) => document.getElementById(id);
const nf0 = new Intl.NumberFormat('es-EC', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('es-EC', { maximumFractionDigits: 2 });
const pf1 = new Intl.NumberFormat('es-EC', { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 });
const n0 = (v) => nf0.format(v || 0);
const n2 = (v) => nf2.format(v || 0);
const pct = (a, b) => b ? pf1.format(a / b) : '–';
const sgn = (v, f = n0) => (v > 0 ? '+' : '') + f(v);
const esc = (s) => String(s ?? '').replace(/[&<>"'`]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
const fmtD = (t) => { if (t == null || isNaN(t)) return '–'; const d = new Date(t); return `${String(d.getUTCDate()).padStart(2, '0')}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${d.getUTCFullYear()}`; };
const isoD = (t) => new Date(t).toISOString().slice(0, 10);
const fromIso = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null; };
const MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const fmtMes = (t) => { const d = new Date(t); return `${MES[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const countBy = (arr, f) => arr.reduce((m, x) => { const k = f(x); m.set(k, (m.get(k) || 0) + 1); return m; }, new Map());
const uniq = (arr) => [...new Set(arr)];
const cmpTxt = (a, b) => String(a).localeCompare(String(b), 'es', { sensitivity: 'base' });

function toast(t) { const el = $('toast'); el.textContent = t; el.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hidden'), 3500); }
function msg(html, kind) {
  const cls = kind === 'err' ? 'bg-tomate-tenue text-tomate border-tomate/40' : kind === 'ok' ? 'bg-violeta-tenue text-violeta border-violeta/30' : 'bg-papel text-gris border-acero';
  $('msg').innerHTML = html ? `<div class="rounded-md border px-3 py-2 ${cls}">${html}</div>` : '';
}
function logEv(evento, detalle) { S.log.push({ t: new Date(), evento, detalle }); }

async function sha256(buf) {
  const h = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

/* =========================================================
   Lectura y validación de archivos (A.8.26 / A.8.28)
   ========================================================= */
function parseDate(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date) return Date.UTC(v.getUTCFullYear(), v.getUTCMonth(), v.getUTCDate());
  if (typeof v === 'number' && isFinite(v) && v > 20000 && v < 80000) { const t = Math.round((v - 25569) * DAY); const d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  if (typeof v === 'string') {
    let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(v.trim()); if (m) return Date.UTC(+m[1], +m[2] - 1, +m[3]);
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v.trim()); if (m) return Date.UTC(+m[3], +m[2] - 1, +m[1]);
  }
  return null;
}
const cleanTxt = (v) => (v == null ? '' : String(v).replace(/[\u0000-\u001F\u007F]/g, ' ').trim().slice(0, 300));

async function readDataset(file, opt = {}) {
  const req = opt.req || REQUIRED, maxRows = opt.maxRows || CFG.MAX_ROWS;
  if (!file) throw new Error('No se seleccionó archivo.');
  if (!/\.xlsx$/i.test(file.name)) throw new Error(`«${esc(file.name)}» no es un archivo .xlsx.`);
  if (file.size > CFG.MAX_FILE_MB * 1048576) throw new Error(`El archivo supera ${CFG.MAX_FILE_MB} MB.`);
  if (file.size < 100) throw new Error('El archivo está vacío o dañado.');
  const buf = await file.arrayBuffer();
  const sig = new Uint8Array(buf, 0, 4);
  if (!(sig[0] === 0x50 && sig[1] === 0x4B)) throw new Error('El contenido no corresponde a un Excel .xlsx válido.');
  const hash = await sha256(buf);
  let sheets;
  try { sheets = await readXlsxFile(buf); } catch (e) { throw new Error('No se pudo leer el Excel. Ábrelo y vuelve a guardarlo como .xlsx.'); }
  if (!Array.isArray(sheets)) sheets = [{ sheet: 'Hoja', data: sheets }];
  // buscar la hoja con las columnas requeridas
  const pref = ['Sheet1', 'Datos', 'Hoja1'];
  sheets.sort((a, b) => (pref.indexOf(a.sheet) === -1 ? 9 : pref.indexOf(a.sheet)) - (pref.indexOf(b.sheet) === -1 ? 9 : pref.indexOf(b.sheet)));
  let found = null;
  for (const sh of sheets) {
    const data = sh.data || [];
    for (let h = 0; h < Math.min(5, data.length); h++) {
      const hdr = (data[h] || []).map((x) => cleanTxt(x));
      const idx = {};
      for (const k of Object.keys(COLS)) idx[k] = hdr.indexOf(COLS[k]);
      idx.prov = hdr.findIndex((c) => /proveedor|vendedor/i.test(c));
      idx.bar = hdr.findIndex((c) => /c[oó]digo de barras|barcode/i.test(c));
      if (req.every((k) => idx[k] >= 0)) { found = { sh, h, idx }; break; }
    }
    if (found) break;
  }
  if (!found) {
    throw new Error('No se encontró una hoja con las columnas requeridas: ' + req.map((k) => '«' + COLS[k] + '»').join(', ') + '.');
  }
  const { sh, h, idx } = found;
  const body = sh.data.slice(h + 1);
  if (body.length > maxRows) throw new Error(`El archivo tiene más de ${n0(maxRows)} filas.`);
  const rows = []; let skipped = 0, badDate = 0, badQty = 0;
  for (const r of body) {
    const id = cleanTxt(r[idx.id]);
    if (!id) { skipped++; continue; }
    const fv = parseDate(r[idx.fv]);
    if (fv == null) { badDate++; continue; }
    let q = idx.qty >= 0 ? r[idx.qty] : 0; q = typeof q === 'number' ? q : parseFloat(String(q ?? '').replace(',', '.'));
    if (!isFinite(q)) { if (idx.qty >= 0) badQty++; q = 0; }
    const est = idx.estRS >= 0 ? cleanTxt(r[idx.estRS]) : '';
    let u = idx.udm >= 0 ? r[idx.udm] : null; u = typeof u === 'number' ? u : parseFloat(String(u ?? '').replace(',', '.'));
    if (!(isFinite(u) && u > 0)) u = null;
    rows.push({
      id, ref: cleanTxt(r[idx.ref]), nombre: cleanTxt(r[idx.nombre]), lab: cleanTxt(r[idx.lab]) || '(sin laboratorio)',
      prov: idx.prov >= 0 ? cleanTxt(r[idx.prov]) : '',
      barcode: idx.bar >= 0 ? keyTxt(r[idx.bar]) : '',
      linea: idx.linea >= 0 ? cleanTxt(r[idx.linea]) : '', rs: cleanTxt(r[idx.rs]), fv, estProd: cleanTxt(r[idx.estProd]),
      qty: q, udm: u, estRSFile: normEst(est),
    });
  }
  if (!rows.length) throw new Error('La hoja no tiene filas de productos válidas.');
  const fvs = rows.map((x) => x.fv);
  const maxFv = Math.max(...fvs), minFv = Math.min(...fvs);
  const hasEstado = rows.some((x) => x.estRSFile);
  const hasUdm = idx.udm >= 0;
  return { fileName: cleanTxt(file.name), size: file.size, hash, sheet: cleanTxt(sh.sheet), rows, skipped, badDate, badQty, maxFv, minFv, hasEstado, hasUdm, hasProv: idx.prov >= 0, provCol: idx.prov >= 0 ? cleanTxt(sh.data[h][idx.prov]) : '', loadedAt: new Date(), ...cutInfo(file, rows, maxFv) };
}
// ¿Corte de todo el portafolio? Trae productos sin stock o RS que vencen mucho después de la ventana de 180 días.
function cutInfo(file, rows, maxFv) {
  const lmD = file.lastModified ? new Date(file.lastModified) : null;
  const lm = lmD ? Date.UTC(lmD.getFullYear(), lmD.getMonth(), lmD.getDate()) : null;
  const fn = fechaNombre(file.name), ref = fn ?? lm ?? maxFv - CFG.WINDOW_DAYS * DAY;
  const full = rows.some((x) => x.qty <= 0) || rows.some((x) => x.fv > ref + (CFG.WINDOW_DAYS + 20) * DAY);
  return { full, suggested: fn ?? (full && lm != null ? lm : maxFv - CFG.WINDOW_DAYS * DAY), dateSrc: fn != null ? 'nombre del archivo' : full ? 'fecha del archivo' : 'vencimiento más lejano − 180 días' };
}

/* =========================================================
   Cálculos (mismas reglas del Excel)
   ========================================================= */
function derive(ds, corte, udmAlt) {
  const all = ds.rows.map((x0) => {
    let udm = x0.udm, udmSrc = 'Archivo';
    if (!(udm > 0)) {
      const alt = udmAlt && udmAlt.get(x0.id);

function calendar(D) {
  const c = new Date(D.corte); const start = Date.UTC(c.getUTCFullYear(), c.getUTCMonth(), 1);
  const prox = D.rows.filter((x) => x.estado !== 'Caducado');
  const rows = []; let acc = 0;
  for (let i = 0; i < 7; i++) {
    const m = Date.UTC(new Date(start).getUTCFullYear(), new Date(start).getUTCMonth() + i, 1);
    const m2 = Date.UTC(new Date(start).getUTCFullYear(), new Date(start).getUTCMonth() + i + 1, 1);
    const f = prox.filter((x) => x.fv >= m && x.fv < m2);
    acc += f.length; rows.push({ m, n: f.length, q: sum(f, (x) => x.qty), acc });
  }
  return { rows, tot: prox.length, qtot: sum(prox, (x) => x.qty) };
}
function aging(D) {

  const cad = D.rows.filter((x) => x.estado === 'Caducado');
  return T_.map(([l, a, b]) => { const f = cad.filter((x) => -x.dias >= a && -x.dias <= b); return { l, c: f.length, g: f.filter((x) => x.grupo === G.GES).length, s: f.filter((x) => x.grupo === G.SIN).length }; });
}

/* ---------- Reducción de pendientes (línea base) ----------
   Cola de RENOVACIÓN: producto (ID) con stock que cumple el alcance y NO está en «PROHIBIDA SU VENTA - ARCSA».
   Pendientes finales = iniciales + nuevos + vencidos − resueltos − otras salidas
   Resuelto = estaba pendiente y ahora tiene fecha de RS vigente (en el corte o en el maestro completo).
   Otras salidas (no son resueltos): pasó a ARCSA (devolución), salió sin renovar (stock en 0), salió sin confirmar.
   % de reducción = (Pendientes línea base − Pendientes actuales) ÷ Pendientes línea base
   Efectividad de cierre = Resueltos ÷ (Iniciales + Nuevos + Vencidos)
   Cola de DEVOLUCIÓN: caducados en «PROHIBIDA SU VENTA - ARCSA» con stock, hasta que salen del reporte.     */
const ALC = [
  { id: 'lion', h: -1, t: 'Todos los caducados con stock (objetivo LION, incluye ARCSA)', c: 'Todos los caducados', uso: 'Objetivo LION: reducir del 100 % al 80 % los productos con stock y RS caducado. Incluye los que están en devolución.' },
  { id: 'cad', h: 0, t: 'Caducados por renovar (sin ARCSA)', c: 'Caducados sin ARCSA', uso: 'Indicador principal. Mide el daño real (bloqueo de venta). Los «vencidos» muestran lo que no se anticipó a tiempo.' },
  { id: '30', h: 30, t: 'Caducados + vencen en ≤ 30 días', c: 'Caducados + ≤ 30 días', uso: 'Urgencia: lo que debe cerrarse en el mes.' },
  { id: '60', h: 60, t: 'Caducados + vencen en ≤ 60 días', c: 'Caducados + ≤ 60 días', uso: 'Seguimiento activo con proveedores y Compras.' },
  { id: '90', h: 90, t: 'Caducados + vencen en ≤ 90 días', c: 'Caducados + ≤ 90 días', uso: 'Anticipación: cartera de renovaciones en curso. Premia renovar antes del vencimiento.' },
  { id: 'tot', h: Infinity, t: 'Todo el reporte (ventana de 180 días)', c: 'Todo el reporte', uso: 'No recomendado como KPI: cada semana entran productos por el borde de 180 días del export, por calendario y no por la gestión.' },
];
const alcSel = () => ALC.find((a) => a.id === S.alc) || ALC[0];
const enAlc = (x, h) => (h === -1 ? x.estado === 'Caducado' : x.estProd !== CFG.ARCSA && (x.estado === 'Caducado' || (h > 0 && x.dias <= h)));
const enDev = (x) => x.grupo === G.GES;
const pendN = (d, h) => new Set(d.rows.filter((x) => enAlc(x, h)).map((x) => x.id)).size;
const COLA_ORD = ['NUE', 'VEN', 'REN', 'RENM', 'ARC', 'S0', 'SNC', 'SIG'];
const COLA_TONO = { NUE: 'tomate', VEN: 'ambar', REN: 'violeta', RENM: 'violeta', ARC: 'gris', S0: 'tomate', SNC: 'ambar', SIG: 'gris' };
const venLbl = (h) => (h <= 0 ? 'Casos vencidos (pasaron a caducado)' : h === Infinity ? 'Casos vencidos / entraron al alcance' : `Casos vencidos o que entraron a ≤ ${h} días`);
const colaLbl = (t, h) => ({ NUE: 'Nuevo', VEN: h <= 0 ? 'Vencido (pasó a caducado)' : `Vencido / entró a ≤ ${h} días`, REN: 'Resuelto · fecha vigente en el corte', RENM: 'Resuelto · fecha vigente en el maestro', ARC: 'Pasó a ARCSA · devolución', S0: 'Sin renovar · stock en 0', SNC: 'Salió sin confirmar', SIG: 'Sigue pendiente' }[t]);
const DEV_LBL = { ING: 'Ingresó a devolución', DEV: 'Devuelto · salió del reporte', DSA: 'Dejó ARCSA (cambio de estado o RS renovado)', SIG: 'Sigue por devolver' };
const DEV_TONO = { ING: 'ambar', DEV: 'violeta', DSA: 'gris', SIG: 'gris' };

// Cruza dos cortes por ID y clasifica cada caso de la cola de renovación
function cola(A, B, h) {
  const MA = new Map(A.rows.map((x) => [x.id, x])), MB = new Map(B.rows.map((x) => [x.id, x])), MM = S.maeMap;
  const r = { ini: 0, nue: 0, ven: 0, renC: 0, renM: 0, arc: 0, s0: 0, snc: 0, fin: 0, det: [] };
  const key = { NUE: 'nue', VEN: 'ven', REN: 'renC', RENM: 'renM', ARC: 'arc', S0: 's0', SNC: 'snc' };
  for (const id of uniq([...MA.keys(), ...MB.keys()])) {
    const a = MA.get(id), b = MB.get(id), ia = !!a && enAlc(a, h), ib = !!b && enAlc(b, h);
    if (!ia && !ib) continue;
    if (ia) r.ini++;
    if (ib) r.fin++;
    let tipo, m = null, msrc = '';
    if (ia && ib) tipo = 'SIG';
    else if (ib) tipo = a && (h === -1 || a.estProd !== CFG.ARCSA) ? 'VEN' : 'NUE';           // vencido: ya estaba en el reporte y entró por el paso del tiempo
    else if (b) tipo = b.estProd === CFG.ARCSA ? 'ARC' : 'REN';                  // sigue en el reporte: pasó a ARCSA o tiene fecha vigente
    else {                                                                       // salió de la población (stock en 0 o RS vigente a > 180 días)
      const ba = allMap(B).get(id);
      if (ba) { m = ba; msrc = 'corte'; tipo = h !== -1 && ba.estProd === CFG.ARCSA ? 'ARC' : ba.estado !== 'Caducado' && ba.fv > B.corte ? 'REN' : 'S0'; }
      else { m = MM ? MM.get(id) : null; msrc = 'mae'; tipo = !m ? 'SNC' : m.estProd === CFG.ARCSA ? 'ARC' : m.fv > B.corte ? 'RENM' : 'S0'; }
    }
    if (key[tipo]) r[key[tipo]]++;
    r.det.push({ id, tipo, a, b, m, msrc, s: b || a });
  }
  r.res = r.renC + r.renM;
  r.otr = r.arc + r.s0 + r.snc;
  r.carga = r.ini + r.nue + r.ven;
  r.neto = r.fin - r.ini;
  r.ok = r.ini + r.nue + r.ven - r.res - r.otr === r.fin;
  r.red = r.ini ? (r.ini - r.fin) / r.ini : null;
  r.efec = r.carga ? r.res / r.carga : null;
  r.det.sort((x, y) => COLA_ORD.indexOf(x.tipo) - COLA_ORD.indexOf(y.tipo) || cmpTxt(x.s.lab, y.s.lab) || cmpTxt(x.s.nombre, y.s.nombre));
  return r;
}

function topLabsCad(D) {

}
function topLabs60(D) {

function domTable(tbl) {
  const ths = [...tbl.querySelectorAll('thead th')];

  const parse = (t, isNum) => {
    t = t.replace(/\s+/g, ' ').trim();

    let m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t);

      if (/^[+-]?\d{1,3}(\.\d{3})*(,\d+)?%$|^[+-]?\d+(,\d+)?%$/.test(c)) return XS.p(parseFloat(c.replace(/\./g, '').replace(',', '.').replace('%', '')) / 100);

    return t;
  };
  return {
    headers: ths.map((th) => th.textContent.trim()),
    rows: [...tbl.querySelectorAll('tbody tr')].map((tr) => [...tr.children].map((td, i) => parse(td.textContent, num[i]))),

function xSheet(name, tbl) {
  const base = { fontFamily: 'Calibri', fontSize: 8, alignVertical: 'top', wrap: true };
  const head = tbl.headers.map((h) => ({ ...base, value: String(h), type: String, fontWeight: 'bold', backgroundColor: '#49267F', textColor: '#FFFFFF', align: 'justify' }));
  const cell = (v) => {
    if (v == null || v === '') return null;
    if (typeof v === 'object' && 'd' in v) return { ...base, value: new Date(v.d), type: Date, format: 'dd/mm/yyyy', align: 'right' };
    if (typeof v === 'object' && 'p' in v) return { ...base, value: v.p, type: Number, format: '0.0%', align: 'right' };
    if (typeof v === 'number') return { ...base, value: v, type: Number, format: Number.isInteger(v) ? '#,##0' : '#,##0.00', align: 'right' };
    return { ...base, value: String(v), type: String, align: 'justify' };
  };
  const data = [head, ...tbl.rows.map((r) => r.map(cell))];
  const widths = tbl.headers.map((h, i) => {
    let w = Math.min(String(h).length, 22);
    for (const r of tbl.rows.slice(0, 400)) { const v = r[i]; const l = v == null ? 0 : typeof v === 'object' ? 10 : String(typeof v === 'number' ? Math.round(v) : v).length + (typeof v === 'number' ? 3 : 0); if (l > w) w = l; }
    return { width: Math.max(8, Math.min(48, Math.round(w * 0.95) + 2)) };

        ['Alcance', A.t, se ? A.t : null], ['Desde', XS.d(S.baseD.corte), se ? XS.d(S.prevD.corte) : null], ['Hasta', XS.d(D.corte), se ? XS.d(D.corte) : null],
        fr('Pendientes iniciales', (r) => r.ini), fr('(+) Casos nuevos', (r) => r.nue), fr('(+) ' + venLbl(A.h), (r) => r.ven),
        fr('(−) Casos resueltos (RS vigente)', (r) => r.res), fr('   Fecha vigente en el corte', (r) => r.renC), fr('   Fecha vigente en el maestro completo', (r) => r.renM),
        fr('(−) Otras salidas (no son resueltos)', (r) => r.otr), fr('   Pasaron a ARCSA · devolución', (r) => r.arc), fr('   Salieron sin renovar (stock en 0)', (r) => r.s0), fr('   Salieron sin confirmar (falta maestro)', (r) => r.snc),
        fr('(=) Pendientes finales', (r) => r.fin), fr('Variación neta', (r) => r.neto), fr('% de reducción vs. inicio', (r) => pN(r.red)), fr('Efectividad de cierre', (r) => pN(r.efec)),
        ['Meta de reducción', XS.p(S.meta / 100), null], ['Estado frente a la meta', semafTxt[semaf(ac.red)], null], ['Maestro completo', S.mae ? S.mae.fileName : 'No cargado', null]] }));
      const dv = colaDev(S.baseD, D), dvs = S.prevD ? colaDev(S.prevD, D) : null, fd = (lbl, f) => [lbl, f(dv), dvs ? f(dvs) : null];
      sheets.push(xSheet('Cola devolución ARCSA', { headers: ['Concepto', 'Acumulado (línea base → actual)', 'Última semana (anterior → actual)'], rows: [
        fd('Por devolver al inicio', (r) => r.ini), fd('(+) Ingresaron a ARCSA', (r) => r.ing), fd('(−) Devueltos (salieron del reporte)', (r) => r.dev), fd('(−) Dejaron ARCSA (cambio de estado)', (r) => r.dsa),
        fd('(=) Por devolver al cierre', (r) => r.fin), fd('Cantidad UdM compra al inicio', (r) => r.qIni), fd('Cantidad UdM compra al cierre', (r) => r.qFin)] }));
      sheets.push(xSheet('Detalle devolución', devFull(dv.det)));
      sheets.push(xSheet('Reducción por alcance', { headers: ['Alcance', 'Pendientes línea base', 'Nuevos', 'Vencidos', 'Resueltos', 'Otras salidas', 'Pendientes actuales', '% reducción', 'Efectividad de cierre', 'Para qué sirve'],
        rows: ALC.map((a) => { const r = cola(S.baseD, D, a.h); return [a.t, r.ini, r.nue, r.ven, r.res, r.otr, r.fin, pN(r.red), pN(r.efec), a.uso]; }) }));
      sheets.push(xSheet('Evolución pendientes', { headers: ['Fecha de corte', 'Archivo', 'Tipo', 'Pendientes', 'Nuevos', 'Vencidos', 'Resueltos', 'Otras salidas', 'Variación neta', '% reducción vs. base', 'Efectividad de cierre', 'Por devolver (ARCSA)'],
        rows: serie(A.h).map((p) => [XS.d(p.d.corte), p.d.fileName, p.esBase ? 'Línea base' : p.d === D ? 'Actual' : 'Corte', p.pend, p.fl ? p.fl.nue : null, p.fl ? p.fl.ven : null, p.fl ? p.fl.res : null, p.fl ? p.fl.otr : null, p.fl ? p.fl.neto : null, p.esBase ? null : pN(p.red), p.fl ? pN(p.fl.efec) : null, p.dev]) }));
      sheets.push(xSheet('Detalle cola', colaFull(ac.det, A.h)));
    }
    sheets.push(xSheet('Pareto proveedores', paretoFull(pareto(D, 'cad'))));
    if (S.cmp && idxCompras()) sheets.push(xSheet('Solicitud a proveedores', solFull(matrizSolicitud().list)));
    const E = evalCompromisos();
    if (E) sheets.push(xSheet('Compromisos', compFull(E.list)), xSheet('Medidor rector', { headers: ['Indicador', 'Valor'], rows: [
      ['Semana desde', XS.d(E.ini + DAY)], ['Semana hasta', XS.d(D.corte)], ['Compromisos con entrega en la semana', E.sem.length], ['Cumplidos en fecha (semana)', E.semOk],
      ['% cumplidos en fecha (semana)', E.pSem == null ? null : XS.p(E.pSem)], ['Semáforo (semana)', SEM_TXT[semR(E.pSem)]], ['Compromisos con fecha ya cumplida (acumulado)', E.acu.length], ['Cumplidos en fecha (acumulado)', E.acuOk],
      ['% cumplidos en fecha (acumulado)', E.pAcu == null ? null : XS.p(E.pAcu)], ['Casos a escalar a Compras', E.escalar.length]] }));
    const OP = oportuna();
    if (OP) sheets.push(xSheet('Renovación oportuna', { headers: ['Tramo en la línea base', 'RS', 'Renovados antes de caducar', 'Caducaron sin renovar', 'Siguen pendientes', 'Salieron (sin dato)', '% renovación oportuna'], rows: OP.map((r) => [r.rg, r.n, r.ren, r.cad, r.pen, r.sal, r.p == null ? null : XS.p(r.p)]) }));
    sheets.push(xSheet('Calidad', { headers: ['Control', 'Resultado', 'Interpretación'], rows: qualityChecks(D).map((c) => [c[0], c[1], c[2]]) }));
    sheets.push(xSheet('Datos', datosFull(D)));
    const fname = `Analisis_RS_${fmtD(D.corte).replace(/\//g, '-')}.xlsx`;
    logEv('Exportación', fname);
    sheets.push(xSheet('Bitácora', { headers: ['Fecha y hora', 'Evento', 'Detalle'], rows: S.log.map((l) => [l.t.toLocaleString('es-EC'), l.evento, l.detalle]) }));
    await saveBook(sheets, fname);
    toast('Excel descargado: ' + fname);
  } catch (e) {
    console.error(e); toast('No se pudo generar el Excel: ' + e.message);
  } finally { btn.disabled = false; btn.textContent = 'Descargar análisis Excel'; }
}

/* =========================================================
   Eventos

function bindDrop(dzId, inputId, slot) {
  const dz = $(dzId), inp = $(inputId);
  const handle = async (file) => {
    if (!file) return;
    dz.querySelector('.fileinfo').textContent = 'Leyendo ' + file.name + '…';
    try {
      const ds = await readDataset(file, slot === 'mae' ? { req: ['id', 'fv'], maxRows: 200000 } : undefined);
      S[slot] = ds;
      dz.querySelector('.fileinfo').textContent = slot === 'mae' ? `✓ ${ds.fileName} · ${n0(ds.rows.length)} productos con fecha de RS${ds.badDate ? ` (${n0(ds.badDate)} sin fecha, no se usan)` : ''}` : `✓ ${ds.fileName} · ${n0(ds.rows.length)} productos · ${ds.full ? 'todo el portafolio' : 'export filtrado'} · fecha propuesta según ${ds.dateSrc}`;
      const dIn = $({ cur: 'dCur', prev: 'dPrev', base: 'dBase' }[slot]);
      if (dIn) { dIn.value = isoD(ds.suggested); dIn.disabled = false; }
      logEv('Carga de archivo', `${{ cur: 'Corte actual', prev: 'Corte anterior', base: 'Línea base', mae: 'Maestro completo' }[slot]}: ${ds.fileName} (${n0(ds.size / 1024)} KB, SHA-256 ${ds.hash.slice(0, 16)}…)`);
      msg('', '');
    } catch (e) {
      S[slot] = null; dz.querySelector('.fileinfo').textContent = '';
      msg('<b>No se pudo usar el archivo.</b> ' + e.message, 'err');
      logEv('Archivo rechazado', e.message.replace(/<[^>]+>/g, ''));
    }
    $('btnRun').disabled = !S.cur;
    inp.value = '';
  };
  inp.addEventListener('change', () => handle(inp.files[0]));
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('border-violeta'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('border-violeta'); }));
  dz.addEventListener('drop', (e) => handle(e.dataTransfer.files[0]));
}
// Cortes intermedios: varios archivos a la vez (fecha = vencimiento más lejano − 180 días)
function bindMulti(dzId, inputId) {
  const dz = $(dzId), inp = $(inputId), info = dz.querySelector('.fileinfo');
  const handle = async (files) => {
    files = [...(files || [])].slice(0, 30);
    if (!files.length) return;
    info.textContent = `Leyendo ${files.length} archivo(s)…`;
    const ok = [], err = [];
    for (const f of files) {
      try { const ds = await readDataset(f); ok.push(ds); logEv('Carga de archivo', `Corte intermedio: ${ds.fileName} (${n0(ds.size / 1024)} KB, SHA-256 ${ds.hash.slice(0, 16)}…)`); }
      catch (e) { err.push(`${esc(f.name)}: ${e.message}`); logEv('Archivo rechazado', e.message.replace(/<[^>]+>/g, '')); }
    }
    S.inter = ok.sort((a, b) => a.suggested - b.suggested);
    info.textContent = ok.length ? '✓ ' + ok.map((d) => `${d.fileName} (${fmtD(d.suggested)})`).join(' · ') : '';
    msg(err.length ? '<b>Algunos cortes intermedios no se pudieron usar.</b> ' + err.join(' · ') : '', err.length ? 'err' : '');
    inp.value = '';
  };
  inp.addEventListener('change', () => handle(inp.files));
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('border-violeta'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('border-violeta'); }));
  dz.addEventListener('drop', (e) => handle(e.dataTransfer.files));
}

function run() {
  if (!S.cur) return;
  const c = fromIso($('dCur').value) ?? S.cur.suggested;
  const udmMap = (ds) => new Map(ds ? ds.rows.filter((x) => x.udm > 0).map((x) => [x.id, x.udm]) : []);
  S.curD = derive(S.cur, c, udmMap(S.prev));
  if (S.prev) {
    const p = fromIso($('dPrev').value) ?? S.prev.suggested;
    if (p >= c) { msg('<b>Revisa las fechas.</b> La fecha de corte anterior debe ser menor que la actual.', 'err'); return; }
    S.prevD = derive(S.prev, p, udmMap(S.cur));
    S.mov = movements(S.prevD, S.curD);
  } else { S.prevD = null; S.mov = null; }
  if (S.base) {
    const b = fromIso($('dBase').value) ?? S.base.suggested;
    if (b >= c) { msg('<b>Revisa las fechas.</b> La fecha de la línea base debe ser menor que la del corte actual.', 'err'); return; }
    if (S.prevD && b > S.prevD.corte) { msg('<b>Revisa las fechas.</b> La línea base debe ser anterior (o igual) al corte anterior.', 'err'); return; }
    S.baseD = derive(S.base, b, udmMap(S.cur));
    const fuera = S.inter.filter((d) => !(d.suggested > b && d.suggested < c)).length;
    S.interD = S.inter.filter((d) => d.suggested > b && d.suggested < c).map((d) => derive(d, d.suggested, udmMap(S.cur)));
    if (fuera) toast(`${n0(fuera)} corte(s) intermedio(s) fuera del rango línea base – corte actual no se usaron.`);
  } else { S.baseD = null; S.interD = []; }
  S.maeMap = S.mae ? new Map(S.mae.rows.map((x) => [x.id, { fv: x.fv, estProd: x.estProd }])) : null;
  logEv('Tablero generado', `Corte ${fmtD(c)}${S.prevD ? ' vs. ' + fmtD(S.prevD.corte) : ''}${S.baseD ? ' · línea base ' + fmtD(S.baseD.corte) : ''}`);
  msg(`Tablero generado con corte al <b>${fmtD(c)}</b>${S.prevD ? ` y comparado con <b>${fmtD(S.prevD.corte)}</b>` : ''}${S.baseD ? ` · línea base <b>${fmtD(S.baseD.corte)}</b>` : ''}.`, 'ok');
  if (S.baseD && S.tab === 'resumen') S.tab = 'reduccion';
  else if (S.prevD && S.tab === 'resumen') S.tab = 'comparativo';
  renderAll();
  $('board').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
}

function clearAll(reason) {
  destroyCharts();
  S.topCharts.forEach((c) => c.destroy());
  S = { cur: null, prev: null, base: null, inter: [], mae: null, maeMap: null, curD: null, prevD: null, baseD: null, interD: [], mov: null, log: S.log, charts: [], topCharts: [], tab: 'resumen', expFull: {}, expName: {}, alertSel: null, movQ: '', movMv: '', segSel: 'A', segQ: '', segPage: 0, alc: S.alc, meta: S.meta, colaF: '', comp: null, parT: 'cad', compF: '', cohF: '', cmp: null, mtz: null, solF: '' };
  logEv('Datos borrados', reason);
  $('panels').innerHTML = ''; $('ribbon').innerHTML = ''; $('ribbonLegend').innerHTML = '';
  $('board').classList.add('hidden'); $('btnExport').classList.add('hidden'); $('btnClear').classList.add('hidden'); $('btnReload').classList.add('hidden');
  $('loader').classList.remove('hidden'); $('heroKpis').innerHTML = '';
  document.querySelectorAll('.fileinfo').forEach((e) => (e.textContent = ''));
  $('dCur').value = ''; $('dPrev').value = ''; $('dPrev').disabled = true; $('dBase').value = ''; $('dBase').disabled = true; $('btnRun').disabled = true;
  $('hdrSub').textContent = 'Carga el export semanal de productos para generar el tablero';
  msg(reason === 'Inactividad' ? `Los datos se borraron tras ${CFG.IDLE_MIN} minutos sin actividad. Vuelve a cargar los archivos.` : 'Datos borrados de la memoria del navegador.', '');
  window.scrollTo(0, 0);
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-alert],[data-seg],[data-page],[data-act],[data-exp]');
  if (!t) return;
  if (t.dataset.exp) { exportTable(t.dataset.exp, t); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; renderTabs(); renderPanel(); $('tab-' + S.tab).focus(); if (t.closest('#heroKpis')) $('tabs').scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  else if (t.dataset.alert) { const i = +t.dataset.alert; S.alertSel = S.alertSel === i ? null : i; renderPanel(); $('movDetail').scrollIntoView({ block: 'start' }); }
  else if (t.dataset.seg) { S.segSel = t.dataset.seg; S.segPage = 0; S.segQ = ''; renderPanel(); }
  else if (t.dataset.page) { S.segPage += +t.dataset.page; renderPanel(); }
  else if (t.dataset.act === 'matrizPA') { descargarMatrizPA().catch((er) => toast('No se pudo generar la matriz: ' + er.message)); }
  else if (t.dataset.act === 'plantilla') { descargarPlantilla().catch((er) => toast('No se pudo generar la plantilla: ' + er.message)); }
  else if (t.dataset.act === 'clearAlert') { S.alertSel = null; renderPanel(); }
  else if (t.dataset.act === 'toLoader') { $('loader').classList.remove('hidden'); $('loader').scrollIntoView({ block: 'start' }); $(t.dataset.focus || 'fPrev').focus(); }
});
document.addEventListener('keydown', (e) => {
  const t = e.target; if (t.getAttribute('role') !== 'tab' || !['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
  const i = TABS.findIndex((x) => x.id === S.tab); S.tab = TABS[(i + (e.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length].id; renderTabs(); renderPanel(); $('tab-' + S.tab).focus();
});
let qTimer;
document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id !== 'movQ' && id !== 'segQ') return;
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    if (id === 'movQ') { S.movQ = e.target.value.slice(0, 80); $('movDetail').innerHTML = movDetail(); const el = $('movQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    else { S.segQ = e.target.value.slice(0, 80); S.segPage = 0; renderPanel(); const el = $('segQ'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }, 250);
});
document.addEventListener('change', (e) => {
  const id = e.target.id;
  if (id === 'movMv') { S.movMv = e.target.value; $('movDetail').innerHTML = movDetail(); }
  else if (id === 'alcSel') { S.alc = ALC.some((a) => a.id === e.target.value) ? e.target.value : 'cad'; logEv('Alcance del indicador', alcSel().t); renderPanel(); $('alcSel').focus(); }
  else if (id === 'metaIn') { const v = parseFloat(e.target.value); S.meta = isFinite(v) ? Math.min(100, Math.max(1, Math.round(v))) : 20; renderPanel(); $('metaIn').focus(); }
  else if (id === 'colaF') { S.colaF = e.target.value; renderPanel(); $('colaF').focus(); }
  else if (id === 'parT') { S.parT = e.target.value; renderPanel(); $('parT').focus(); }
  else if (id === 'compF') { S.compF = e.target.value; renderPanel(); $('compF').focus(); }
  else if (id === 'cohF') { S.cohF = e.target.value; renderPanel(); $('cohF').focus(); }
  else if (id === 'solF') { S.solF = e.target.value; renderPanel(); $('solF').focus(); }
  else if (e.target.dataset && e.target.dataset.map && S.cmp) { const r = e.target.dataset.map; S.cmp.map[r] = +e.target.value; logEv('Columna del reporte de compras', `${r} → ${S.cmp.hdr[+e.target.value] || 'no usar'}`); renderPanel(); }
});

bindDrop('dzCur', 'fCur', 'cur');
bindDrop('dzPrev', 'fPrev', 'prev');
bindDrop('dzBase', 'fBase', 'base');
bindMulti('dzInter', 'fInter');
bindDrop('dzMae', 'fMae', 'mae');
function bindGen(dzId, inputId, slot, label, guess, maxMB) {
  const dz = $(dzId), inp = $(inputId), info = dz.querySelector('.fileinfo');
  const handle = async (file) => {
    if (!file) return;
    info.textContent = `Leyendo ${file.name} (${n0(file.size / 1048576)} MB)… en archivos grandes puede tardar un minuto.`;
    await new Promise((r) => setTimeout(r, 30)); // deja pintar el mensaje
    try {
      let ds;
      const porPartes = () => readXlsxStream(file, maxMB, (p, n) => { info.textContent = `Leyendo ${file.name}… ${p != null ? Math.round(p * 100) + ' % · ' : ''}${n0(n)} filas`; });
      if (slot === 'cmp' && file.size > 12 * 1048576) ds = await porPartes();
      else { try { ds = await readGeneric(file, maxMB); } catch (e1) { if (slot !== 'cmp' || /supera|no es un archivo/.test(e1.message)) throw e1; ds = await porPartes(); } }
      ds.map = guess(ds.hdr); S[slot] = ds;
      info.textContent = `✓ ${ds.fileName} · ${n0(ds.rows.length)} filas · hoja «${ds.sheet}»${ds.compacto ? ` · se conservaron ${ds.hdr.length} columnas útiles` : ''}`;
      logEv('Carga de archivo', `${label}: ${ds.fileName} (${n0(ds.rows.length)} filas, SHA-256 ${ds.hash.slice(0, 16)}…)`);
      msg('', ''); if (S.curD) renderPanel();
    } catch (e) { S[slot] = null; info.textContent = ''; msg(`<b>No se pudo usar ${esc(label.toLowerCase())}.</b> ` + e.message, 'err'); logEv('Archivo rechazado', e.message.replace(/<[^>]+>/g, '')); }
    inp.value = '';
  };
  inp.addEventListener('change', () => handle(inp.files[0]));
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('border-violeta'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('border-violeta'); }));
  dz.addEventListener('drop', (e) => handle(e.dataTransfer.files[0]));
}
bindGen('dzCmp', 'fCmp', 'cmp', 'El reporte de compras', guessCompras, 200);
bindGen('dzMtz', 'fMtz', 'mtz', 'La matriz de proveedores', guessMatriz);
(function bindComp() {
  const dz = $('dzComp'), inp = $('fComp'), info = dz.querySelector('.fileinfo');
  const handle = async (file) => {
    if (!file) return;
    info.textContent = 'Leyendo ' + file.name + '…';
    try {
      S.comp = await readCompromisos(file);
      info.textContent = `✓ ${S.comp.fileName} · ${n0(S.comp.rows.length)} RS · hoja «${S.comp.sheet}»${S.comp.badF ? ` · ${n0(S.comp.badF)} fechas no reconocidas` : ''}`;
      logEv('Carga de archivo', `Registro de compromisos: ${S.comp.fileName} (${n0(S.comp.rows.length)} RS, SHA-256 ${S.comp.hash.slice(0, 16)}…)`);
      msg('', ''); if (S.curD) renderPanel();
    } catch (e) { S.comp = null; info.textContent = ''; msg('<b>No se pudo usar el registro de compromisos.</b> ' + e.message, 'err'); logEv('Archivo rechazado', e.message.replace(/<[^>]+>/g, '')); }
    inp.value = '';
  };
  inp.addEventListener('change', () => handle(inp.files[0]));
  ['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('border-violeta'); }));
  ['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('border-violeta'); }));
  dz.addEventListener('drop', (e) => handle(e.dataTransfer.files[0]));
})();
$('btnRun').addEventListener('click', run);
$('btnExport').addEventListener('click', exportExcel);
$('btnReload').addEventListener('click', () => { const l = $('loader'); l.classList.toggle('hidden'); if (!l.classList.contains('hidden')) l.scrollIntoView({ block: 'start' }); });
$('btnClear').addEventListener('click', () => clearAll('Borrado manual'));
['dCur', 'dPrev', 'dBase'].forEach((id) => $(id).addEventListener('change', () => { if (S.curD) run(); }));

// Cierre por inactividad (A.8.1 / A.5.15)
let idle;
const resetIdle = () => { clearTimeout(idle); idle = setTimeout(() => { if (S.cur || S.prev || S.base || S.mae || S.comp || S.cmp || S.mtz || S.inter.length) clearAll('Inactividad'); }, CFG.IDLE_MIN * 60000); };
['click', 'keydown', 'pointermove', 'scroll', 'touchstart'].forEach((ev) => document.addEventListener(ev, resetIdle, { passive: true }));
resetIdle();
// borrar al salir
window.addEventListener('pagehide', () => { S.cur = S.prev = S.base = S.mae = S.maeMap = S.comp = S.cmp = S.mtz = S.curD = S.prevD = S.baseD = S.mov = null; S.inter = []; S.interD = []; });
logEv('Sesión iniciada', navigator.userAgent.slice(0, 120));
})();
